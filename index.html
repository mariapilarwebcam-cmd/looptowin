<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoopToWin - Play Free Instant Arcade Games</title>
  
  <meta name="description" content="Play free online games instantly! Sign up to rank on the global leaderboard. No install needed.">
  <meta name="keywords" content="free online games, instant play, browser games, arcade, LoopToWin">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #121520;
      --accent-neon-cyan: #00f0ff;
      --accent-neon-pink: #ff0055;
      --accent-neon-yellow: #ffea00;
      --accent-purple: #7000ff;
      --text-bright: #ffffff;
      --text-muted: #8d95ab;
      --card-border: rgba(0, 240, 255, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.12) 0%, transparent 40%);
      color: var(--text-bright);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(16px);
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid rgba(0, 240, 255, 0.2);
    }

    .brand-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--text-bright);
      text-decoration: none;
      font-style: italic;
    }

    .brand-logo span { color: var(--accent-neon-cyan); }

    .btn-register-header {
      background: linear-gradient(135deg, var(--accent-neon-cyan), var(--accent-purple));
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.8rem;
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-register-header:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
    }

    .ad-banner-container {
      width: 100%;
      max-width: 1000px;
      margin: 15px auto;
      display: flex;
      justify-content: center;
    }

    .mobile-ad { display: none; }
    .desktop-ad { display: block; }
    @media (max-width: 768px) {
      .desktop-ad { display: none; }
      .mobile-ad { display: block; }
      .brand-logo { font-size: 1.5rem; }
      .btn-register-header { font-size: 0.7rem; padding: 6px 12px; }
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 20px;
      flex: 1;
      width: 100%;
    }

    .hero-banner {
      background: linear-gradient(135deg, rgba(112, 0, 255, 0.25) 0%, rgba(0, 240, 255, 0.1) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .hero-banner h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-neon-yellow);
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .catalog-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .catalog-title::before {
      content: '';
      width: 6px;
      height: 24px;
      background: var(--accent-neon-cyan);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: block;
    }

    .game-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-neon-cyan);
      box-shadow: 0 10px 20px rgba(0, 240, 255, 0.15);
    }

    .card-thumbnail {
      height: 170px;
      background: #0b0d14;
      position: relative;
    }

    .card-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-tag {
      position: absolute;
      top: 12px; right: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: 900;
      background: var(--accent-neon-pink);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    .card-content { padding: 18px; }
    .game-name { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .game-description { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--accent-neon-cyan);
      border-radius: 18px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
    }

    .modal-close {
      position: absolute;
      top: 15px; right: 20px;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover { color: #fff; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .form-input, .form-select {
      width: 100%;
      padding: 10px;
      background: #090c14;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .form-input:focus, .form-select:focus {
      border-color: var(--accent-neon-cyan);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent-neon-pink), var(--accent-purple));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }

    footer {
      background: #040508;
      padding: 30px;
      text-align: center;
      margin-top: 50px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="brand-logo">LOOP<span>TOWIN</span></a>
    <button class="btn-register-header" onclick="openRegisterModal()" id="userAuthBtn">SIGN UP / LOG IN 🏆</button>
  </header>

  <!-- Top Ad Banner Container -->
  <div class="ad-banner-container">
    <div class="desktop-ad">
      <script type="text/javascript">
        atOptions = { 'key' : '7c3da643b5e08990d9109aaf99c9f0fe', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
      </script>
      <script type="text/javascript" src="https://onionclose.com/7c3da643b5e08990d9109aaf99c9f0fe/invoke.js"></script>
    </div>
    <div class="mobile-ad">
      <script type="text/javascript">
        atOptions = { 'key' : '2e33ef8f844b01eff6ffa2c69eafecac', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
      </script>
      <script type="text/javascript" src="https://onionclose.com/2e33ef8f844b01eff6ffa2c69eafecac/invoke.js"></script>
    </div>
  </div>

  <main>
    <div class="hero-banner">
      <h2>⚡ NO INSTALL NEEDED • SIGN UP TO RANK TOP GLOBAL</h2>
      <p>Play instantly! Register to save your high scores and climb the global leaderboards.</p>
    </div>

    <h1 class="catalog-title">FEATURED GAMES</h1>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <!-- Registration Modal -->
  <div class="modal-overlay" id="registerModal">
    <div class="modal-box">
      <span class="modal-close" onclick="closeRegisterModal()">&times;</span>
      <h2 style="font-family:'Orbitron'; color:var(--accent-neon-cyan); margin-bottom:15px; text-align:center;">PLAYER REGISTRATION</h2>
      <form onsubmit="handleRegistration(event)">
        <div class="form-group">
          <label>GAMERTAG / USERNAME</label>
          <input type="text" id="regUsername" class="form-input" placeholder="e.g., GamerPro99" required>
        </div>
        <div class="form-group">
          <label>EMAIL ADDRESS</label>
          <input type="email" id="regEmail" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>COUNTRY</label>
          <select id="regCountry" class="form-select" required>
            <option value="United States">🇺🇸 United States</option>
            <option value="Canada">🇨🇦 Canada</option>
            <option value="United Kingdom">🇬🇧 United Kingdom</option>
            <option value="Mexico">🇲🇽 Mexico</option>
            <option value="Spain">🇪🇸 Spain</option>
            <option value="Colombia">🇨🇴 Colombia</option>
            <option value="Other">🌍 Other Location</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">CREATE ACCOUNT & PLAY 🚀</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 LoopToWin. All rights reserved.</p>
  </footer>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://cgfmcawubrtlkyhduvka.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnZm1jYXd1YnJ0bGt5aGR1dmthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDY3NzEsImV4cCI6MjEwMTY4Mjc3MX0.iwZuIPjfV9cAjy9Xw5SNe602-tN3Xg-6vBgrA14nUCs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Games Catalog
    const gamesCatalog = [
      { id: "office-escape", title: "Office Escape", description: "Dodge your bosses and survive the daily grind.", path: "/games/office-escape/index.html", image: "/games/office-escape/cover.png" },
      { id: "alien-survivor", title: "Alien Survivor", description: "Wipe out swarms of alien invaders in survivor-style action.", path: "/games/alien-survivor/index.html", image: "/games/alien-survivor/cover.png" },
      { id: "window-cleaner", title: "Window Cleaner", description: "Scale skyscrapers, clean windows, and grab cheese treats.", path: "/games/window-cleaner/index.html", image: "/games/window-cleaner/cover.png" }
    ];

    // Modal Functions
    function openRegisterModal() { 
      document.getElementById("registerModal").style.display = "flex"; 
    }
    
    function closeRegisterModal() { 
      document.getElementById("registerModal").style.display = "none"; 
    }

    // Close modal when clicking outside the box
    window.onclick = function(event) {
      const modal = document.getElementById('registerModal');
      if (event.target == modal) {
        closeRegisterModal();
      }
    }

    // Registration Handler
    async function handleRegistration(e) {
      e.preventDefault();
      
      const btn = document.querySelector(".btn-submit");
      const originalText = btn.innerText;
      btn.innerText = "SIGNING UP...";
      btn.disabled = true;

      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const country = document.getElementById("regCountry").value;

      // 1. Create User in Supabase Auth
      const { data, error } = await supabaseClient.auth.signUp({
        email, 
        password, 
        options: { data: { username, country } }
      });

      if (error) {
        alert("Registration Error: " + error.message);
        btn.innerText = originalText;
        btn.disabled = false;
        return;
      }

      // 2. Insert Profile Record
      await supabaseClient.from('profiles').insert([{ 
        username: username, 
        email: email, 
        country: country 
      }]);
      
      // 3. Save locally for session recognition across games
      localStorage.setItem("loop_player_name", username);
      
      alert("Registration successful! Welcome, " + username);
      
      // Update UI
      updateAuthButton(username);
      closeRegisterModal();
      
      btn.innerText = originalText;
      btn.disabled = false;
    }

    // Render Game Cards
    function renderCatalog() {
      const grid = document.getElementById("gamesGrid");
      grid.innerHTML = "";
      
      gamesCatalog.forEach(game => {
        const card = document.createElement("a");
        card.href = game.path;
        card.className = "game-card";
        
        card.innerHTML = `
          <div class="card-thumbnail">
            <img src="${game.image}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/400x225/121520/00f0ff?text=${encodeURIComponent(game.title)}'">
            <span class="badge-tag">PLAY NOW 🔥</span>
          </div>
          <div class="card-content">
            <h2 class="game-name">${game.title}</h2>
            <p class="game-description">${game.description}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Update Header Button
    function updateAuthButton(username) {
      if(username) {
        document.getElementById("userAuthBtn").innerText = `PLAYER: ${username.toUpperCase()}`;
      }
    }

    // Initialize Page
    document.addEventListener("DOMContentLoaded", () => {
      renderCatalog();
      
      const savedUser = localStorage.getItem("loop_player_name");
      if(savedUser) {
        updateAuthButton(savedUser);
      }
    });
  </script>
</body>
</html>
